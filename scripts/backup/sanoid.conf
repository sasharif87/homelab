# Sanoid ZFS snapshot config — deploy to /etc/sanoid/sanoid.conf on Proxmox host
# VERIFY dataset names before enabling: run `zpool list && zfs list` on the Proxmox host

# ── Retention templates ────────────────────────────────────────────────────────

[template_standard]
    frequently = 0
    hourly = 48
    daily = 30
    monthly = 6
    yearly = 0
    autosnap = yes
    autoprune = yes

[template_critical]
    frequently = 0
    hourly = 48
    daily = 90
    monthly = 12
    yearly = 0
    autosnap = yes
    autoprune = yes

# ── Datasets ──────────────────────────────────────────────────────────────────
# Verified pool names from: zpool list (May 18, 2026); docker-nvme added June 19, 2026
# storage              = 32.7TB raidz2 array (media, photos, downloads)
# apps                 = SSD mirror — NFS appdata exports (container configs, npm certs)
#
# NOTE: docker-nvme/vm-docker (VM 101 data zvol) is deliberately NOT sanoid-managed.
# It is non-sparse (volsize 900G, refreservation ~914G) on a 952G pool, so once the
# guest refills the disk there is no room for ZFS to honor the reservation AND take a
# snapshot — every snapshot fails "out of space".
#
# CORRECTED Aug 22, 2026: this note previously claimed virtio1 has backup=1 and that the
# weekly vzdump therefore captures the zvol. It does not. `qm config 101` reads
# `virtio1: /dev/zvol/docker-nvme/vm-docker,backup=0`, and vzdump-weekly.sh documents that
# exclusion as a prerequisite. So the zvol has NO snapshots and is NOT in the VM image.
# Its only coverage is docker-data-backup.sh — a weekly file-level rsync of
# /mnt/docker-local/ that additionally excludes Ollama. That is crash-consistent at best
# for the live Postgres / Elasticsearch data it holds. Tracked in Docs/TODO.md.

[storage]
    use_template = standard
    recursive = yes

[apps]
    use_template = critical
    recursive = yes

# Transit/scratch only — nothing here is original. docker-data is a copy of a pool that
# has its own snapshots; vzdump/host-config regenerate weekly. Snapshotting it had pinned
# 396 G (2x the 200 G live) across 81 snapshots. Worse, it made the full-resend path in
# qnap-zfs-backup.sh (rm -f "${ds_dir}"/*.zst) free nothing, so a forced audiobooks resend
# would spike the pool by ~1.4 TB. autosnap=no stops new ones; autoprune stays on so the
# existing 396 G ages out on the normal schedule rather than being destroyed outright.
#
# CAVEAT (verified against sanoid 2.2.0 source, Aug 22 2026): [storage] uses recursive=yes,
# and sanoid's init loop copies every parent key onto each child, overwriting explicit child
# settings. Which one lands last depends on `foreach my $section (keys %ini)` — an UNORDERED
# Perl hash walk. Measured 25/25 runs with the explicit autosnap=no applied last, so it wins
# in practice, but it is iteration order, not a documented guarantee. The failure mode is
# benign (staging simply keeps being snapshotted) which is why this is preferred over
# dropping recursive=yes and enumerating all ~22 children, where a missed dataset would
# silently lose snapshot protection. VERIFY after deploy:
#   zfs list -t snapshot storage/offsite-staging | tail -3   # no new autosnaps after today
[storage/offsite-staging]
    use_template = standard
    autosnap = no
    autoprune = yes
    recursive = yes
