# Sanoid ZFS snapshot config — deploy to /etc/sanoid/sanoid.conf on Proxmox host
# VERIFY dataset names before enabling: run `zpool list && zfs list` on the Proxmox host

# ── Retention templates ────────────────────────────────────────────────────────

[template_standard]
    frequently = 0
    hourly = 48
    daily = 30
    monthly = 6
    yearly = 0
    autosnap = yes
    autoprune = yes

[template_critical]
    frequently = 0
    hourly = 48
    daily = 90
    monthly = 12
    yearly = 0
    autosnap = yes
    autoprune = yes

# ── Datasets ──────────────────────────────────────────────────────────────────
# Verified pool names from: zpool list (May 18, 2026)
# storage          = 32.7TB raidz2 array (media, photos, downloads)
# apps             = SSD mirror — NFS appdata + vm101-docker zvol (Docker/Ollama)
# apps/vm101-docker = 400GB zvol — Docker data-root, covered by apps recursive

[storage]
    use_template = standard
    recursive = yes

[apps]
    use_template = critical
    recursive = yes
