# Migrated off abandoned dperson/samba (EOL OpenSSL 1.1.1, ~5yr stale) to the
# maintained ServerContainers/samba image — June 23, 2026.
#
# Config translation from the old dperson flags:
#   -u "shan;$SAMBA_PASSWORD"                  -> ACCOUNT_shan
#   -s "storage;/mnt/storage;yes;no;no;shan"   -> SAMBA_VOLUME_CONFIG_storage
#       (name;path;browseable;readonly;guest;users)
#   -g "force user = root"                      -> kept on the share (behavior unchanged)
#
# Perf fixes folded in while migrating (small-file write ~0.077 MB/s diagnosis,
# June 22 2026): host networking (no docker-proxy on 445), SMB signing off,
# aio + socket tuning. See Docs/TODO.md "Container Migrations".
services:
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    restart: unless-stopped
    # host networking: skips the docker bridge + docker-proxy on 445 (per-op
    # latency fix) and exposes 137-139/445 directly. No `ports:` in host mode.
    network_mode: host
    hostname: samba
    environment:
      - TZ=America/Chicago
      # Discovery daemons weren't present under dperson; disable to avoid the
      # CAP_NET_ADMIN requirement and keep parity with prior behavior.
      - WSDD2_DISABLE=true
      - AVAHI_DISABLE=true
      # --- user ---
      - ACCOUNT_shan=${SAMBA_PASSWORD}
      # --- share: \\<server-ip>\storage -> all of /mnt/storage ---
      - SAMBA_VOLUME_CONFIG_storage=[storage]; path = /mnt/storage; valid users = shan; guest ok = no; read only = no; browseable = yes; force user = root
      - SAMBA_VOLUME_CONFIG_games=[games]; path = /mnt/games; valid users = shan; guest ok = no; read only = no; browseable = yes; force user = root
      # --- global perf tuning (small-file write fix) ---
      # ServerContainers format: label = smb.conf key (use _SPACE_ for spaces), value = value
      - SAMBA_GLOBAL_CONFIG_server_SPACE_signing=no
      - SAMBA_GLOBAL_CONFIG_client_SPACE_signing=no
      - SAMBA_GLOBAL_CONFIG_aio_SPACE_read_SPACE_size=1
      - SAMBA_GLOBAL_CONFIG_aio_SPACE_write_SPACE_size=1
      - SAMBA_GLOBAL_CONFIG_socket_SPACE_options=TCP_NODELAY
      - SAMBA_GLOBAL_CONFIG_min_SPACE_receivefile_SPACE_size=16384
      - SAMBA_GLOBAL_CONFIG_use_SPACE_sendfile=yes
    volumes:
      - /mnt/storage:/mnt/storage
      - /mnt/games:/mnt/games
