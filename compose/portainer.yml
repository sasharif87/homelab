services:
  portainer:
    image: portainer/portainer-ce:latest
    init: true
    container_name: portainer
    restart: unless-stopped
    ports:
      - 9443:9443
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
