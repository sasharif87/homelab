# IME Production Stack — Proxmox Services VM
# Port 8081 (HTTP) — NPM proxy: ime.<your-domain> -> http://localhost:8081
# Ollama: reuses existing VM Ollama at host.docker.internal:11434 (no dedicated container)
# Env file: /mnt/apps/appdata/ime/src/.env.prod
#
# Deploy: docker compose -f /mnt/apps/compose/ime.yml --env-file /mnt/apps/appdata/ime/src/.env.prod up -d
# Logs:   docker compose -f /mnt/apps/compose/ime.yml logs -f
# Pull:   docker compose -f /mnt/apps/compose/ime.yml pull && docker compose ... up -d

services:
  nginx:
    image: ghcr.io/sasharif87/ime-nginx:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ime_logs:/var/log/nginx
      - /mnt/apps/appdata/ime/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ime-backend:
        condition: service_healthy
      ime-frontend:
        condition: service_healthy
    networks:
      - ime_frontend

  ime-frontend:
    image: ghcr.io/sasharif87/ime-frontend:latest
    restart: unless-stopped
    networks:
      - ime_frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  ime-backend:
    image: ghcr.io/sasharif87/ime-backend:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://ime:${POSTGRES_PASSWORD}@postgres:5432/ime
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      LOCAL_FS_ROOT: /mnt/corpus
      IME_ENV: production
      IME_LOG_LEVEL: ${IME_LOG_LEVEL:-INFO}
      DEPLOYMENT_MODE: selfhosted
      GDRIVE_CREDENTIALS_PATH: /run/secrets/gdrive_credentials.json
      GDRIVE_TOKEN_PATH: /run/secrets/gdrive_token.json
      GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:-}
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      GDRIVE_OAUTH_REDIRECT_URI: ${GDRIVE_OAUTH_REDIRECT_URI}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-5}
    volumes:
      - ime_corpus:/mnt/corpus:ro
      - ime_output:/mnt/output
      - ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/secrets/credentials.json:/run/secrets/gdrive_credentials.json:ro
      - ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/secrets/token.json:/run/secrets/gdrive_token.json
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ime_backend
      - ime_frontend
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ime
      POSTGRES_USER: ime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ime_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ime -d ime"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ime_backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ime_chroma:/chroma/chroma
    networks:
      - ime_backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ime_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ime_backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  migrate:
    image: ghcr.io/sasharif87/ime-backend:latest
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ime:${POSTGRES_PASSWORD}@postgres:5432/ime
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ime_backend
    restart: "no"

networks:
  ime_frontend:
    driver: bridge
  ime_backend:
    driver: bridge

volumes:
  ime_postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/postgres

  ime_chroma:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/chroma

  ime_redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/redis

  ime_corpus:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/corpus

  ime_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/output

  ime_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${IME_DATA_ROOT:-/mnt/apps/appdata/ime/data}/logs
