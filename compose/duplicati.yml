services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
      # Web UI / REST API password (recorded in Docs/secrets.md). Also consumed by
      # scripts/duplicati-seed-backups.sh as DUPLICATI_WEBPASSWORD for API calls.
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_WEBPASSWORD}
    ports:
      - 8200:8200
    volumes:
      - /mnt/apps/appdata/duplicati:/config
      - /mnt/storage/downloads/duplicati-temp:/run/duplicati-temp
      # temp dblock build dir -> storage HDD, off the QLC docker-nvme overlay
      - /mnt/storage/downloads/duplicati-temp:/run/duplicati-temp
      # Backup destinations
      - /mnt/storage/backups:/backups
      - /mnt/qnap-backups/duplicati-backups:/backups-qnap
      # Sources (read-only)
      - /mnt/apps/appdata:/source/appdata:ro
      - /mnt/apps/compose:/source/compose:ro
      - /mnt/apps/npm/data:/source/npm-data:ro
      - /mnt/storage/photos:/source/photos:ro
      - /mnt/storage/data:/source/data:ro
      - /mnt/storage/knowledge:/source/knowledge:ro
      - /mnt/docker-local/appdata-local/sonarr:/source/sonarr:ro
      - /mnt/docker-local/appdata-local/radarr:/source/radarr:ro
      - /mnt/docker-local/appdata-local/prowlarr:/source/prowlarr:ro
      - /mnt/docker-local/appdata-local/lazylibrarian:/source/lazylibrarian:ro
      - /mnt/docker-local/appdata-local/bazarr:/source/bazarr:ro
      - /mnt/docker-local/appdata-local/lidarr:/source/lidarr:ro
