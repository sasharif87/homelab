services:
  tubearchivist:
    image: bbilly1/tubearchivist:latest
    init: true
    container_name: tubearchivist
    restart: unless-stopped
    # /cache moved off docker-nvme to /mnt/storage/downloads/tubearchivist-cache
    # (Aug 15/16, 2026 incident) after the July 8 mitigation regressed and /cache
    # ended up back on the docker-nvme zvol. Sustained yt-dlp/remux writes there
    # collapse the slow-TLC-leg mirror and stall the whole host. Kept the blkio
    # cap on /dev/vda as defense-in-depth in case /cache ever lands back on it.
    blkio_config:
      device_write_bps:
        - path: /dev/vda
          rate: 25mb
    ports:
      - 8000:8000
    environment:
      - ES_URL=http://tubearchivist-es:9200
      - REDIS_CON=redis://tubearchivist-redis:6379
      - HOST_UID=1000
      - HOST_GID=1000
      - TA_HOST=<server-ip>
      - TA_USERNAME=admin
      - TA_PASSWORD=${TA_PASSWORD}
      - ELASTIC_PASSWORD=${TA_ES_PASSWORD}
      - TZ=America/Chicago
      - TA_AUTO_UPDATE_YTDLP=release
      - PYTHONPATH=/opt/yt_plugins/bgutil:/opt/ta-pyhooks
    volumes:
      - /mnt/storage/media/youtube:/youtube
      - /mnt/storage/downloads/tubearchivist-cache:/cache
      - /mnt/apps/appdata/tubearchivist/pyhooks:/opt/ta-pyhooks:ro
    depends_on:
      - tubearchivist-es
      - tubearchivist-redis
      - bgutil-provider
    labels:
      - com.centurylinklabs.watchtower.enable=false

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    container_name: bgutil-provider
    restart: unless-stopped
    expose:
      - "4416"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  tubearchivist-es:
    # 8.19.0 -> 8.19.20 (Aug 21, 2026): patch-only bump within the same minor
    # line TA tests against (TA's own compose pins "8.19.0" as the alternative
    # to bbilly1/tubearchivist-es) — closes 8 Elastic security advisories
    # (ESA-2026-56 through -116) issued since 8.19.0 shipped. No API/mapping
    # changes expected at the patch level.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.20
    init: true
    container_name: tubearchivist-es
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${TA_ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=true
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.flood_stage=1gb
      - cluster.routing.allocation.disk.watermark.high=2gb
      - cluster.routing.allocation.disk.watermark.low=3gb
      - path.repo=/usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /mnt/apps/appdata/tubearchivist/es:/usr/share/elasticsearch/data
    labels:
      - com.centurylinklabs.watchtower.enable=false

  tubearchivist-redis:
    # Switched from redis/redis-stack-server (Aug 21, 2026): that image lagged
    # core Redis's July 23 security release (CVE-2026-23479 and others fixed in
    # 7.4.10; redis-stack-server's latest build still bundled 7.4.7 with no
    # newer image published). TA's own upstream docker-compose.yml uses plain
    # redis, not the stack variant — TA doesn't need the JSON/Search modules.
    image: redis:latest
    init: true
    container_name: tubearchivist-redis
    restart: unless-stopped
    volumes:
      - /mnt/apps/appdata/tubearchivist/redis:/data
    labels:
      - com.centurylinklabs.watchtower.enable=false
