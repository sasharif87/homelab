services:
  tubearchivist:
    image: bbilly1/tubearchivist:latest
    container_name: tubearchivist
    restart: unless-stopped
    ports:
      - 8000:8000
    environment:
      - ES_URL=http://tubearchivist-es:9200
      - REDIS_CON=redis://tubearchivist-redis:6379
      - HOST_UID=1000
      - HOST_GID=1000
      - TA_HOST=${SERVER_IP}
      - TA_USERNAME=admin
      - TA_PASSWORD=${TA_PASSWORD}
      - ELASTIC_PASSWORD=${TA_ES_PASSWORD}
      - TZ=America/Chicago
    volumes:
      - /mnt/storage/media/youtube:/youtube
      - /mnt/docker-local/appdata/tubearchivist/cache:/cache
    depends_on:
      - tubearchivist-es
      - tubearchivist-redis
    labels:
      - com.centurylinklabs.watchtower.enable=false

  tubearchivist-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: tubearchivist-es
    restart: unless-stopped
    environment:
      - ELASTIC_PASSWORD=${TA_ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=true
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - path.repo=/usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /mnt/docker-local/appdata/tubearchivist/es:/usr/share/elasticsearch/data
    labels:
      - com.centurylinklabs.watchtower.enable=false

  tubearchivist-redis:
    image: redis/redis-stack-server:latest
    container_name: tubearchivist-redis
    restart: unless-stopped
    volumes:
      - /mnt/apps/appdata/tubearchivist/redis:/data
    labels:
      - com.centurylinklabs.watchtower.enable=false
