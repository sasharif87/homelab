services:
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    init: true
    container_name: profilarr
    restart: unless-stopped
    ports:
      - 6868:6868
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /mnt/apps/appdata/profilarr:/config
