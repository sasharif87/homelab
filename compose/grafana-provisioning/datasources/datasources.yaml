apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: ${SERVER_IP}:5432
    user: grafana_ro
    secureJsonData:
      password: ${GRAFANA_POSTGRES_PASSWORD}
    jsonData:
      database: speedtest
      sslmode: disable
      postgresVersion: 1600
    editable: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 60s
    editable: true
